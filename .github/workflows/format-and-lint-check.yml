name: Formatting & lint check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check build
        run: npm run build

      - name: Check lint and TypeScript
        run: npm run lint

      - name: Check Prettier
        run: npm run format:check
